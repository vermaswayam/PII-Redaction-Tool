<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PII redaction</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 22px; }
    form { margin-top: 20px; padding: 16px; border: 1px solid #ccc; }
    button { margin-top: 12px; padding: 8px 14px; }
    .msg { background: #fff3cd; padding: 8px; margin-bottom: 12px; }
    .note { color: #555; font-size: 14px; margin-top: 18px; }
  </style>
</head>
<body>
  <h1>PII redaction</h1>
  <p>Upload a .docx, get a redacted copy back.</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}
        <div class="msg">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form action="{{ url_for('redact') }}" method="post" enctype="multipart/form-data">
    <input type="file" name="document" accept=".docx" required />
    <br />
    <button type="submit">Redact</button>
  </form>

  <p class="note">CLI: python redact_pii.py -i input.docx</p>
</body>
</html>
